name: Build and release

# Builds Litwell for Windows (Litwell.exe) and macOS (Litwell.app, zipped) on
# GitHub's own machines, and can publish both as a GitHub Release.
#
#   Build only (to try it):   Actions -> "Build and release" -> Run workflow
#   Publish a release:        Actions -> Run workflow -> tick "Publish a release"
#                             (or push a tag:  git tag v1.2.0 && git push origin v1.2.0)
#
# Release files are named with the version from litsearch/__init__.py:
#     Litwell-<version>-Windows.exe      Litwell-<version>-macOS.zip
# Every run also keeps both files as downloadable "artifacts" on the run page.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with both files"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed only to create the release

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version
        id: ver
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('litsearch/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Litwell version $v"

      - name: Tag must match the app version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version ${{ steps.ver.outputs.version }} (litsearch/__init__.py). Bump the version or re-tag."
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt "pyinstaller>=6.3"

      - name: Check the app imports (tkinter present)
        run: python -c "import tkinter, app; print('import ok', app.APP_TITLE)"

      - name: Build Litwell.exe (single file)
        env:
          LITSEARCH_ONEFILE: "1"
        run: pyinstaller --noconfirm litsearch.spec

      - name: Name and check the file
        shell: pwsh
        run: |
          Move-Item dist/Litwell.exe "dist/Litwell-${{ steps.ver.outputs.version }}-Windows.exe"
          $f = Get-Item "dist/Litwell-${{ steps.ver.outputs.version }}-Windows.exe"
          "{0}  {1:N1} MB" -f $f.Name, ($f.Length / 1MB)
          if ($f.Length -lt 5MB) { throw "Windows build is suspiciously small" }

      - uses: actions/upload-artifact@v4
        with:
          name: Litwell-Windows
          path: dist/Litwell-*-Windows.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt "pyinstaller>=6.3"

      - name: Check the app imports (tkinter present)
        run: python -c "import tkinter, app; print('import ok', app.APP_TITLE)"

      - name: Build Litwell.app
        env:
          LITWELL_TARGET_ARCH: universal2   # runs on both Apple-silicon and Intel Macs
        run: pyinstaller --noconfirm litsearch.spec

      - name: Report architectures
        run: |
          lipo -archs dist/Litwell.app/Contents/MacOS/Litwell
          plutil -p dist/Litwell.app/Contents/Info.plist | grep -i "Version"

      - name: Self-test the built app (informational)
        continue-on-error: true
        run: dist/Litwell.app/Contents/MacOS/Litwell --selftest

      - name: Zip the app for download
        run: |
          v=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('litsearch/__init__.py').read()).group(1))")
          ditto -c -k --sequesterRsrc --keepParent dist/Litwell.app "dist/Litwell-$v-macOS.zip"
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Litwell-macOS
          path: dist/Litwell-*-macOS.zip
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          tag="v$VERSION"
          ls -l release-files
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Litwell $VERSION" > notes.md
          cat >> notes.md <<'NOTE'

          **Windows:** download the `.exe` and open it. If Windows says "Windows protected your PC", click *More info* then *Run anyway*.
          **Mac:** download the `.zip`, unzip it, drag Litwell to Applications and open it. If macOS blocks it, go to System Settings -> Privacy & Security -> *Open Anyway*.
          NOTE
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" release-files/* --target "$GITHUB_SHA" --title "Litwell $VERSION" --notes-file notes.md
          fi
